<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athens seat screen preview</title>
<style>
body{margin:0;background:#080810;color:white;font:15px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;z-index:2;background:#111e;padding:16px;border-radius:10px;max-width:290px}button{padding:10px;margin:3px;cursor:pointer}button[aria-pressed=true]{background:#376bd4;color:white}p{line-height:1.4}video{width:100%;max-height:130px}label{display:block;margin-top:12px}
</style>
<aside><b>Athens · flat screen preview</b><p id="status">Loading venue…</p>
<div id="seats"></div><video id="video" controls muted playsinline preload="auto"></video>
<button id="view">Return to seat</button><button id="orbit">Orbit screen</button>
<label>Screen width <input id="size" type="range" min="3" max="16" step="0.25" value="10"></label>
<p>Drag to look around. Each seat plays its own clip on the same flat screen.</p>
<p>Seat positions are illustrative. Clips are not audio synchronized.</p></aside>
<script type="module" src="./marble-screen.js?v=6"></script>
</html>
