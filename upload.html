<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Party Replay</title>
    <style>
      /* Colour tokens. Every text pair is at least 4.5:1 (checked), UI boundaries at least 3:1. */
      :root {
        color-scheme: dark;
        --bg: #0d0d10;
        --surface: #14141a;
        --surface-hover: #181d2e;
        --border: #666678;
        --text: #eeeef2;
        --muted: #a1a1b0;
        --accent: #2563eb;
        --success: #15803d;
        --danger: #ff8b8b;
        --ring: #8ab4ff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
      main { position: relative; z-index: 1; width: 100%; max-width: 480px; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

      /* The generated room, behind everything: drawn small, then blurred, dimmed and pushed back. */
      #bg { position: fixed; inset: -6%; width: 112%; height: 112%; z-index: 0; opacity: 0; filter: blur(12px) saturate(1.3) brightness(.8); transition: opacity 1.2s ease; pointer-events: none; }
      #bg.ready { opacity: 1; }
      .scrim { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(13,13,16,0), rgba(13,13,16,.5)); }

      /* The floating glass card, with a contact shadow on the "floor" that breathes against it. */
      .card { display: grid; gap: 16px; padding: 20px; border-radius: 24px; background: rgba(18,18,24,.82); border: 1px solid rgba(255,255,255,.14);
        -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
        box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 24px 48px -12px rgba(0,0,0,.65), 0 10px 20px -6px rgba(0,0,0,.45);
        animation: float 7s ease-in-out infinite; }
      .floor { width: 72%; height: 20px; margin: 22px auto 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.6), transparent); filter: blur(7px); animation: floor 7s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes floor { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.88); opacity: .55; } }
      .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      :is(a, button, label, textarea, input):focus-visible, .zone:has(:focus-visible) .drop, .pics:has(#images:focus-visible) .add { outline: 3px solid var(--ring); outline-offset: 2px; }
      label, button, a { touch-action: manipulation; cursor: pointer; }

      .drop { display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 160px; padding: 16px; text-align: center; border: 2px dashed var(--border); border-radius: 16px; background: var(--surface); color: var(--muted); transition: border-color .2s ease, background-color .2s ease; }
      .drop:hover, .drop.over { border-color: var(--accent); background: var(--surface-hover); }
      .drop.has { border-style: solid; border-color: var(--success); color: var(--text); }
      .drop b { font-size: 18px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
      .drop small { font-size: 14px; }
      svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .field { display: grid; gap: 8px; }
      .label { font-size: 14px; font-weight: 600; color: var(--text); }
      .label small { font-weight: 400; color: var(--muted); margin-left: 6px; }

      .pics { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .add { display: grid; place-items: center; width: 64px; height: 64px; border: 2px dashed var(--border); border-radius: 12px; background: var(--surface); color: var(--muted); transition: border-color .2s ease, color .2s ease; }
      .add:hover { border-color: var(--accent); color: var(--text); }
      .thumb { position: relative; width: 64px; height: 64px; border-radius: 12px; background: center / cover var(--surface); }
      .thumb button { position: absolute; top: -16px; right: -16px; width: 44px; height: 44px; padding: 0; border: 0; background: none; }
      .thumb button::before { content: "\00d7"; position: absolute; inset: 11px; border-radius: 50%; background: #000d; color: #fff; font-size: 18px; line-height: 22px; text-align: center; }

      #pin { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; }
      textarea { width: 100%; min-height: 104px; resize: vertical; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; }
      textarea::placeholder { color: var(--muted); }
      textarea:focus-visible { border-color: transparent; }

      .go { width: 100%; min-height: 48px; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; transition: filter .2s ease; }
      .go:hover:not(:disabled) { filter: brightness(1.12); }
      .go:active:not(:disabled) { filter: brightness(.9); }
      .go:disabled { background: #23232d; color: #8a8a98; cursor: not-allowed; }
      a.open { display: grid; place-items: center; min-height: 48px; padding: 12px; border-radius: 12px; background: var(--success); color: #fff; font-size: 17px; font-weight: 600; text-decoration: none; }
      a.open:hover { filter: brightness(1.12); }

      progress { width: 100%; height: 6px; border: 0; border-radius: 3px; overflow: hidden; accent-color: var(--accent); }
      #msg { min-height: 1.5em; text-align: center; font-size: 15px; color: var(--muted); }
      #msg.err { color: var(--danger); }
      [hidden] { display: none !important; }

      @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="scrim" aria-hidden="true"></div>
    <main>
      <div class="card">
      <h1 class="sr">Party Replay</h1>

      <div class="zone">
        <input id="video" class="sr" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm,.m4v" />
        <label class="drop" id="drop" for="video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          <b id="drop-title">Add mp4</b>
          <small id="drop-sub">Drop your video here or tap to choose</small>
        </label>
      </div>

      <div class="field">
        <span class="label" id="img-label">Add supplemental images <small>optional, up to 4</small></span>
        <div class="pics" id="pics" role="group" aria-labelledby="img-label">
          <input id="images" class="sr" type="file" accept="image/*" multiple />
          <label class="add" for="images" aria-label="Add images">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </label>
        </div>
      </div>

      <div class="field">
        <label class="label" for="prompt">Prompt <small>optional</small></label>
        <textarea id="prompt" placeholder="Describe the room, for example: an empty dining room with a long wooden table, warm evening light"></textarea>
      </div>

      <div class="field" id="pin-row" hidden>
        <label class="label" for="pin">Upload PIN</label>
        <input id="pin" type="password" autocomplete="off" />
      </div>

      <button class="go" id="go" disabled>Create</button>
      <progress id="bar" max="100" value="0" aria-label="Progress" hidden></progress>
      <div id="msg" role="status" aria-live="polite"></div>
      <a class="open" id="open" href="/" hidden>Open the room</a>
      </div>
      <div class="floor" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/upload.js"></script>
  </body>
</html>
