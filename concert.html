<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Concert Replay</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
      body { font-family: -apple-system, system-ui, sans-serif; color: #fff; }
      canvas { display: block; }
      #ui { position: fixed; left: 0; right: 0; bottom: 72px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
      #ui button, #seats button { font-size: 15px; padding: 10px 16px; border-radius: 8px; border: 1px solid #fff8; background: #0008; color: #fff; }
      #seats { position: fixed; left: 0; right: 0; bottom: 124px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
      #seats button { font-size: 13px; padding: 6px 12px; }
      #seats button.current { background: #4f7cffcc; border-color: #fff; }
      #status { position: fixed; top: 12px; left: 16px; right: 16px; font-size: 14px; line-height: 1.4; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre-line; }
      #btn-exit { display: none; position: fixed; top: 10px; right: 10px; z-index: 10; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 0; background: #0006; color: #fff; }
      body.cardboard #ui, body.cardboard #seats, body.cardboard #VRButton, body.cardboard #status { display: none !important; }
      body.cardboard #btn-exit { display: block; }
    </style>
  </head>
  <body>
    <div id="status">Starting...</div>
    <div id="seats"></div>
    <div id="ui">
      <button id="btn-start">Start (desktop)</button>
      <button id="btn-cardboard">Cardboard (gyro)</button>
    </div>
    <button id="btn-exit">Exit</button>
    <script type="module" src="/src/concert.js"></script>
  </body>
</html>
